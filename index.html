
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zenisai</title>
    <meta name="description" content="A premium mobile-first AI-powered music player with dynamic theming, live AI voice interactions, and robust playlist management.">
    <meta property="og:title" content="Zenisai">
    <meta property="og:description" content="A premium mobile-first AI-powered music player with dynamic theming, live AI voice interactions, and robust playlist management.">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <meta name="theme-color" content="#030711">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            screens: {
              'xs': '400px',
              'landscape': { 'raw': '(orientation: landscape)' },
              'portrait': { 'raw': '(orientation: portrait)' },
              'compact-landscape': { 'raw': '(orientation: landscape) and (max-height: 520px)' },
              'tablet': '768px',
              'desktop': '1024px',
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @property --color-primary {
            syntax: '<color>';
            initial-value: #3b82f6;
            inherits: true;
        }
        @property --color-bg {
            syntax: '<color>';
            initial-value: #030711;
            inherits: true;
        }
        @property --color-glow {
            syntax: '<color>';
            initial-value: rgba(59, 130, 246, 0.2);
            inherits: true;
        }
        @property --color-surface {
          syntax: '<color>';
          initial-value: #0b1220;
          inherits: true;
        }
        @property --color-tint {
          syntax: '<color>';
          initial-value: rgba(59, 130, 246, 0.12);
          inherits: true;
        }

        :root {
            --color-primary: #3b82f6;
            --color-bg: #030711;
            --color-surface: #0b1220;
            --color-glow: rgba(59, 130, 246, 0.2);
            --color-tint: rgba(59, 130, 246, 0.12);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            transition: --color-primary 1.2s cubic-bezier(0.23, 1, 0.32, 1), 
                        --color-bg 1.2s cubic-bezier(0.23, 1, 0.32, 1), 
                        --color-glow 1.2s cubic-bezier(0.23, 1, 0.32, 1),
                        --color-surface 1.2s cubic-bezier(0.23, 1, 0.32, 1),
                        --color-tint 1.2s cubic-bezier(0.23, 1, 0.32, 1);
        }

        body { 
            font-family: 'DM Sans', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            background-color: var(--color-bg);
            color: white;
            transition: background-color 1.5s cubic-bezier(0.23, 1, 0.32, 1);
            user-select: none;
            overflow: hidden;
            width: 100vw;
            height: 100dvh;
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
        }

        h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }

        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .dynamic-theme-element {
            transition: all 1s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glow-overlay {
            background: radial-gradient(circle at center, var(--color-glow), transparent 85%);
            transition: background 2s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 0;
            pointer-events: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            transition: transform 0.2s ease;
        }

        input[type="range"]:active::-webkit-slider-thumb {
            transform: scale(1.4);
        }

        /* Silky smooth text transitions */
        h1, h2, h3, p, span {
            transition: color 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Accent Utilities using Dynamic CSS Variables */
        .text-accent { color: var(--color-primary) !important; }
        .bg-accent { background-color: var(--color-primary) !important; }
        .border-accent { border-color: var(--color-primary) !important; }
        .shadow-accent { box-shadow: 0 0 30px var(--color-glow); }
        .fill-accent { fill: var(--color-primary) !important; }
        .bg-accent-tint { background-color: var(--color-tint) !important; }
        .border-accent-tint { border-color: var(--color-tint) !important; }

        /* ============================================================
           THEME MODES & VISIBILITY ENHANCEMENTS
           ============================================================ */

        /* 1. OLED Pitch Black Theme */
        body.theme-oled {
            background-color: #000000 !important;
            --color-bg: #000000 !important;
            --color-surface: #070707 !important;
            color: #ffffff !important;
        }
        body.theme-oled article,
        body.theme-oled .bg-\[var\(--color-surface\)\] {
            background-color: #070707 !important;
            border-color: #18181b !important;
        }

        /* 2. Modern Crisp Light Theme (Pure White & High-Contrast Black Typography) */
        body.theme-light {
            background-color: #ffffff !important;
            color: #000000 !important;
            --color-bg: #ffffff !important;
            --color-surface: #ffffff !important;
            --color-card-bg: #f8fafc !important;
            --color-border: rgba(15, 23, 42, 0.14) !important;
            --color-text: #000000 !important;
            --color-text-dim: #1e293b !important;
            --color-text-muted: #334155 !important;
        }

        /* Enforce Black Typography across all standard headings, paragraphs, and labels */
        body.theme-light,
        body.theme-light h1,
        body.theme-light h2,
        body.theme-light h3,
        body.theme-light h4,
        body.theme-light p:not(.text-accent):not([class*="text-accent"]):not([class*="bg-accent"] *),
        body.theme-light span:not(.text-accent):not([class*="text-accent"]):not([class*="bg-accent"] *):not([class*="bg-black"] *):not([class*="bg-zinc-9"] *),
        body.theme-light label,
        body.theme-light div:not(.bg-accent):not([class*="bg-accent"]):not([class*="bg-black"]):not([class*="bg-zinc-9"]):not([class*="text-accent"]) {
            color: #000000;
        }

        /* Tailwind Text Utility Class Overrides for Light Theme */
        body.theme-light .text-white,
        body.theme-light .text-white\/95,
        body.theme-light .text-white\/90,
        body.theme-light .text-white\/85,
        body.theme-light .text-white\/80,
        body.theme-light .text-white\/75 {
            color: #000000 !important;
        }

        body.theme-light .text-white\/70,
        body.theme-light .text-white\/65,
        body.theme-light .text-white\/60,
        body.theme-light .text-white\/55,
        body.theme-light .text-white\/50,
        body.theme-light .text-white\/45,
        body.theme-light .text-gray-300,
        body.theme-light .text-zinc-300,
        body.theme-light .text-slate-300 {
            color: #1e293b !important;
        }

        body.theme-light .text-white\/40,
        body.theme-light .text-white\/35,
        body.theme-light .text-white\/30,
        body.theme-light .text-white\/25,
        body.theme-light .text-white\/20,
        body.theme-light .text-white\/10,
        body.theme-light .text-gray-400,
        body.theme-light .text-zinc-400,
        body.theme-light .text-slate-400,
        body.theme-light .text-gray-500,
        body.theme-light .text-zinc-500,
        body.theme-light .text-slate-500 {
            color: #334155 !important;
        }

        /* Accent Colors on Lyrics and Highlighted Text */
        body.theme-light .text-accent,
        body.theme-light [class*="text-accent"],
        body.theme-light p.text-accent,
        body.theme-light span.text-accent {
            color: var(--color-primary) !important;
        }
        body.theme-light .border-accent,
        body.theme-light [class*="border-accent"] {
            border-color: var(--color-primary) !important;
        }
        body.theme-light .bg-accent {
            background-color: var(--color-primary) !important;
            color: #ffffff !important;
        }

        /* Inactive lyrics readability in light mode */
        body.theme-light .lyrics-inactive {
            color: #334155 !important;
        }

        /* Light Theme: Inputs, Dropdowns & Controls */
        body.theme-light input:not([type="range"]),
        body.theme-light select,
        body.theme-light textarea {
            background-color: #ffffff !important;
            color: #000000 !important;
            border-color: rgba(15, 23, 42, 0.22) !important;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08) !important;
        }
        body.theme-light input::placeholder,
        body.theme-light textarea::placeholder {
            color: #64748b !important;
        }
        body.theme-light select option {
            background-color: #ffffff !important;
            color: #000000 !important;
        }

        /* Light Theme: Card Surfaces & Borders */
        body.theme-light .bg-white\/\[0\.02\],
        body.theme-light .bg-white\/\[0\.03\],
        body.theme-light .bg-white\/\[0\.035\],
        body.theme-light .bg-white\/\[0\.04\],
        body.theme-light .bg-white\/\[0\.06\],
        body.theme-light .bg-white\/\[0\.07\],
        body.theme-light .bg-white\/\[0\.08\],
        body.theme-light .bg-white\/5,
        body.theme-light .bg-white\/10 {
            background-color: rgba(15, 23, 42, 0.04) !important;
            border-color: rgba(15, 23, 42, 0.14) !important;
        }
        body.theme-light .border-white\/5,
        body.theme-light .border-white\/10,
        body.theme-light .border-white\/15,
        body.theme-light .border-white\/20,
        body.theme-light [class*="border-white\/"] {
            border-color: rgba(15, 23, 42, 0.14) !important;
        }

        /* Light Theme: Floating Hub & Mini Player */
        body.theme-light #floating-hub > div {
            background: #ffffff !important;
            border-color: rgba(15, 23, 42, 0.16) !important;
            box-shadow: 0 16px 45px -4px rgba(15, 23, 42, 0.16) !important;
        }

        /* Light Theme: Modals & Panels */
        body.theme-light .fixed.inset-0 > div:not(.absolute):not(#floating-hub) {
            background-color: #ffffff !important;
            color: #000000 !important;
            border-color: rgba(15, 23, 42, 0.16) !important;
            box-shadow: 0 25px 60px -10px rgba(15, 23, 42, 0.22) !important;
        }

        /* Light Theme: Reel Floating Actions on Photos */
        body.theme-light article .absolute.right-3 button:not(.bg-accent) {
            background-color: rgba(255, 255, 255, 0.92) !important;
            border-color: rgba(15, 23, 42, 0.16) !important;
            color: #000000 !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12) !important;
        }
        body.theme-light article .absolute.right-3 button:not(.bg-accent) svg {
            color: #000000 !important;
        }
        body.theme-light article .absolute.right-3 button.text-accent svg {
            color: var(--color-primary) !important;
        }
        body.theme-light article .absolute.right-3 button.bg-accent svg {
            color: #ffffff !important;
        }

        /* Light Theme: Elements that must keep white text (e.g. badges, dark tags) */
        body.theme-light [class*="bg-black"] .text-white,
        body.theme-light [class*="bg-black"] [class*="text-white/"],
        body.theme-light [class*="bg-zinc-9"] .text-white,
        body.theme-light [class*="bg-zinc-9"] [class*="text-white/"],
        body.theme-light [class*="bg-rose-500"] *,
        body.theme-light [class*="bg-emerald-500"] *,
        body.theme-light .keep-white {
            color: #ffffff !important;
        }

        /* 3. Cyberpunk Neon Theme */
        body.theme-neon {
            --color-glow: rgba(6, 182, 212, 0.45);
        }
        body.theme-neon * {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.15);
        }

        /* 4. Warm Champagne Elegant Theme */
        body.theme-elegant {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, serif;
        }

        /* TV & 10-foot UI Navigation: accessible focus rings */
        :focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
            box-shadow: 0 0 20px var(--color-glow);
        }

        /* Animations & Keyframes */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.85; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s ease-in-out infinite;
        }

        @keyframes wave-glow {
            0% { filter: hue-rotate(0deg) brightness(1); }
            50% { filter: hue-rotate(25deg) brightness(1.2); }
            100% { filter: hue-rotate(0deg) brightness(1); }
        }
        .animate-wave-glow {
            animation: wave-glow 8s ease-in-out infinite;
        }

        /* Media Query Bootstrapping: Phone Landscape (compact height) */
        @media (orientation: landscape) and (max-height: 520px) {
            .compact-landscape-compact-header {
                height: 2.25rem !important;
                margin-bottom: 0.25rem !important;
            }
            .compact-landscape-action-rail {
                flex-direction: row !important;
                right: 1rem !important;
                top: auto !important;
                bottom: 1rem !important;
                transform: none !important;
                max-width: calc(100% - 2rem) !important;
            }
        }

        /* Media Query Bootstrapping: Desktop & Tablets */
        @media (min-width: 1024px) {
            .app-container-desktop {
                max-width: 1200px;
                margin-left: auto;
                margin-right: auto;
            }
        }

        /* TV / Large Display Mode */
        @media (min-width: 1600px) {
            html { font-size: 18px; }
            .app-container-desktop { max-width: 1440px; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0"
  }
}
</script>
</head>
<body class="selection:bg-blue-500/30 overflow-hidden">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('SW registered');
          }).catch(err => {
            console.log('SW failed', err);
          });
        });
      }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
